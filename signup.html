<!DOCTYPE html>
<html>
<head>
    <title>Signup Page</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
<form>
    <h2>Signup Form</h2>
    <label>name</label>
    <input type="text"required placeholder="enter your name"><br><br>
    <label>DOB</label>
    <input type="date"required> <br><br>
    <label>email</label>
    <input type="email"required placeholder="enter your email"><br><br>
    <label>phone number</label>
    <input type="number"required placeholder="enter your phone number"><br><br>
    <label >password</label>
    <input type="password" required placeholder="enter your password" minlength="6" maxlength="10"><br><br>
    <label>confirm password</label>
    <input type="password"required> <br><br>
    <button type="submit">login</button>
</form>
</body>
</html>
